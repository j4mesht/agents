[project]
name = "trading_agent"
version = "0.1.0"
description = "trading-agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.7.2"
]

[project.scripts]
trading_agent = "trading_agent.main:run"
run_crew = "trading_agent.main:run"
train = "trading_agent.main:train"
replay = "trading_agent.main:replay"
test = "trading_agent.main:test"
run_with_trigger = "trading_agent.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
